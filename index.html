<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta http-equiv="X-UA-Compatible" content="IE=edge"><link rel="preconnect" href="https://fonts.googleapis.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><title>BIBLIOTHEK DES WISSENS</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Raleway:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"><style>
:root {
  --gold: #C9A84C;
  --gold-light: #F0D080;
  --gold-dim: #8B6914;
  --black: #050505;
  --dark: #0A0A0A;
  --dark2: #111111;
  --dark3: #181818;
  --dark4: #222222;
  --gray: #888;
  --gray-light: #AAA;
  --red: #E50914;
  --white: #F5F5F5;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--black);
  color: var(--white);
  font-family: 'Raleway', sans-serif;
  overflow-x: hidden;
  cursor: default;
}

/* ===== NOTIFICATION ===== */
#notification {
  position: fixed;
  background: linear-gradient(135deg, rgba(20,20,20,0.95) 0%, rgba(15,15,15,0.95) 100%);
  color: var(--gold);
  padding: 16px 24px;
  border-radius: 12px;
  font-family: 'Raleway', sans-serif;
  font-weight: 500;
  font-size: 13px;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 1px 1px rgba(201,168,76,0.2);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(201,168,76,0.4);
  transition: all 0.2s ease;
  white-space: normal;
  letter-spacing: 0.02em;
  max-width: 300px;
  line-height: 1.5;
}

#notification.show {
  opacity: 1;
}

@media (max-width: 768px) {
  #notification {
    font-size: 12px;
    padding: 14px 20px;
    max-width: 280px;
  }
}

/* ===== NAVBAR ===== */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  background: linear-gradient(180deg, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.8) 100%);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(201,168,76,0.18);
  padding: 0 4%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  transition: all 0.3s ease;
}

.nav-inner {
  display: flex;
  align-items: center;
  height: 64px;
  gap: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  margin-right: 40px;
  cursor: pointer;
  flex-shrink: 0;
}

.logo-icon {
  width: 38px;
  height: 38px;
  position: relative;
  flex-shrink: 0;
}

.logo-icon svg {
  width: 100%;
  height: 100%;
}

.logo-text {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1.2;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 28px;
  flex: 1;
}

.nav-links a {
  color: var(--gray-light);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: 0.03em;
  transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
  position: relative;
  padding-bottom: 4px;
  cursor: pointer;
  white-space: nowrap;
}

.nav-links a:first-child {
  color: var(--gold);
}

.nav-links a:first-child::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: var(--gold);
  border-radius: 1px;
}

.nav-links a:hover {
  color: var(--gold);
  text-shadow: 0 0 12px rgba(201,168,76,0.4);
}

.nav-icons {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-left: auto;
}

.nav-icon {
  width: 22px;
  height: 22px;
  cursor: pointer;
  color: var(--gray-light);
  transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
  position: relative;
  filter: drop-shadow(0 0 0 rgba(201,168,76,0));
}

.nav-icon:hover {
  color: var(--gold);
  filter: drop-shadow(0 0 8px rgba(201,168,76,0.4));
  transform: scale(1.1);
}

.notif-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  width: 9px;
  height: 9px;
  background: var(--red);
  border-radius: 50%;
  border: 1.5px solid var(--black);
}

/* ===== SUPPORT BUTTON ===== */
.support-footer-button {
  background: linear-gradient(135deg, var(--gold) 0%, #b8951f 100%);
  color: var(--black);
  border: none;
  border-radius: 12px;
  padding: 14px 32px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  margin-top: 16px;
}

.support-footer-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(201,168,76,0.3);
}







.support-page-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(201,168,76,0.3);
}



/* ===== FOOTER BUTTONS ROW ===== */
.footer-buttons-row {
  display: flex;
  flex-direction: row;
  gap: 16px;
  align-items: center;
  justify-content: center;
}

/* ===== FAQ BUTTON ===== */


.faq-page-btn:hover {
  background: rgba(201,168,76,0.12);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(201,168,76,0.2);
}

/* ===== FAQ MODAL ===== */
.faq-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  padding: 20px;
}

.faq-modal.active {
  opacity: 1;
  pointer-events: all;
}

.faq-modal-content {
  background: linear-gradient(160deg, #1c1c1c 0%, #0d0d0d 100%);
  border: 1px solid rgba(201,168,76,0.28);
  border-radius: 18px;
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.85), inset 0 1px 1px rgba(201,168,76,0.1);
  animation: faqSlideIn 0.22s ease-out;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: rgba(201,168,76,0.3) transparent;
}

.faq-modal-content::-webkit-scrollbar { width: 5px; }
.faq-modal-content::-webkit-scrollbar-track { background: transparent; }
.faq-modal-content::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 3px; }

@keyframes faqSlideIn {
  from { opacity: 0; transform: scale(0.94) translateY(-24px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.faq-close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(201,168,76,0.1);
  border: 1px solid rgba(201,168,76,0.3);
  border-radius: 50%;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  font-size: 22px;
  cursor: pointer;
  transition: all 0.2s;
  z-index: 3001;
  line-height: 1;
}

.faq-close-btn:hover {
  background: rgba(201,168,76,0.22);
  border-color: var(--gold);
  transform: rotate(90deg);
}

/* FAQ Header */
.faq-header {
  text-align: center;
  padding: 44px 32px 28px;
  border-bottom: 1px solid rgba(201,168,76,0.18);
}

.faq-header-icon {
  font-size: 30px;
  margin-bottom: 12px;
}

.faq-header-title {
  font-family: 'Cinzel', serif;
  font-size: 26px;
  font-weight: 900;
  color: var(--gold);
  letter-spacing: 0.07em;
  line-height: 1.2;
  margin-bottom: 10px;
  text-shadow: 0 0 16px rgba(201,168,76,0.25);
}

.faq-header-subtitle {
  font-family: 'Raleway', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: var(--gray-light);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.faq-header-divider {
  color: var(--gold-dim);
  font-size: 16px;
  opacity: 0.6;
}

/* FAQ Body */
.faq-body {
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.faq-item {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(201,168,76,0.12);
  border-radius: 14px;
  padding: 20px 20px;
  transition: border-color 0.2s, background 0.2s;
}

.faq-item:hover {
  border-color: rgba(201,168,76,0.28);
  background: rgba(201,168,76,0.05);
}

.faq-item-highlight {
  border-color: rgba(201,168,76,0.22);
  background: rgba(201,168,76,0.04);
}

.faq-item-icon {
  font-size: 30px;
  width: 54px;
  height: 54px;
  min-width: 54px;
  background: radial-gradient(circle, rgba(201,168,76,0.18) 0%, rgba(201,168,76,0.05) 100%);
  border: 1px solid rgba(201,168,76,0.25);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.faq-item-content {
  flex: 1;
}

.faq-item-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.faq-number {
  width: 26px;
  height: 26px;
  min-width: 26px;
  background: linear-gradient(135deg, var(--gold) 0%, #8B6914 100%);
  color: var(--black);
  border-radius: 50%;
  font-size: 12px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cinzel', serif;
  flex-shrink: 0;
}

.faq-question {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.04em;
  line-height: 1.3;
}

.faq-answer {
  font-family: 'Raleway', sans-serif;
  font-size: 13px;
  color: var(--gray-light);
  line-height: 1.65;
  letter-spacing: 0.01em;
}

.faq-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.faq-list li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-family: 'Raleway', sans-serif;
  font-size: 13px;
  color: var(--gray-light);
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.faq-check {
  color: var(--gold);
  font-size: 11px;
  margin-top: 2px;
  flex-shrink: 0;
}

/* FAQ Footer Badges */
.faq-footer-badges {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 12px;
  padding: 20px 28px 32px;
  border-top: 1px solid rgba(201,168,76,0.15);
  flex-wrap: wrap;
}

.faq-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
  flex: 1;
  min-width: 70px;
}

.faq-badge span {
  font-size: 22px;
  width: 46px;
  height: 46px;
  background: rgba(201,168,76,0.1);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.faq-badge p {
  font-family: 'Raleway', sans-serif;
  font-size: 9px;
  font-weight: 700;
  color: var(--gray-light);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  line-height: 1.4;
}

@media (max-width: 768px) {
  .faq-header { padding: 40px 20px 24px; }
  .faq-header-title { font-size: 20px; }
  .faq-body { padding: 20px 16px; }
  .faq-item { padding: 16px; gap: 12px; }
  .faq-item-icon { width: 44px; height: 44px; min-width: 44px; font-size: 22px; }
  .faq-question { font-size: 12px; }
  .faq-footer-badges { gap: 8px; padding: 18px 16px 28px; }
  .faq-badge p { font-size: 8px; }
  .footer-buttons-row { gap: 12px; }
  
}

/* ===== SEARCH BAR ===== */
.search-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  z-index: 2500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease;
  padding-top: 100px;
}

.search-modal.active {
  opacity: 1;
  pointer-events: all;
}

.search-bar-container {
  width: 100%;
  max-width: 600px;
  padding: 0 20px;
  animation: slideDownSearch 0.4s ease-out;
}

@keyframes slideDownSearch {
  from {
    opacity: 0;
    transform: translateY(-30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.search-input-wrapper {
  display: flex;
  gap: 12px;
  align-items: center;
}

.search-input {
  flex: 1;
  background: rgba(255, 255, 255, 0.08);
  border: 1.5px solid rgba(201, 168, 76, 0.3);
  border-radius: 12px;
  padding: 16px 20px;
  color: var(--white);
  font-size: 16px;
  font-family: 'Raleway', sans-serif;
  transition: all 0.3s;
  letter-spacing: 0.01em;
}

.search-input:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(201, 168, 76, 0.08);
  box-shadow: 0 0 10px rgba(201,168,76,0.12);
}

.search-input::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

.search-btn {
  background: linear-gradient(135deg, var(--gold) 0%, #b8951f 100%);
  color: var(--black);
  border: none;
  border-radius: 12px;
  padding: 16px 32px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  white-space: nowrap;
}

.search-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(201,168,76,0.3);
}

.search-btn:active {
  transform: translateY(0);
}

.search-loading {
  display: none;
  text-align: center;
  padding: 60px 20px;
}

.search-loading.show {
  display: block;
}

.search-spinner {
  width: 50px;
  height: 50px;
  border: 3px solid rgba(201, 168, 76, 0.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 24px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.search-loading-text {
  color: var(--gold);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.05em;
}

.search-results {
  display: none;
  text-align: center;
  padding: 60px 20px;
  max-width: 600px;
  margin: 0 auto;
}

.search-results.show {
  display: block;
}

.search-results-message {
  color: var(--gray-light);
  font-size: 16px;
  line-height: 1.6;
  margin-bottom: 24px;
  font-weight: 500;
}

.search-login-btn {
  background: linear-gradient(135deg, var(--gold) 0%, #b8951f 100%);
  color: var(--black);
  border: none;
  border-radius: 12px;
  padding: 14px 40px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
}

.search-login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(201,168,76,0.3);
}

.search-close-btn {
  position: fixed;
  top: 30px;
  right: 30px;
  background: none;
  border: none;
  color: var(--gray-light);
  font-size: 32px;
  cursor: pointer;
  transition: color 0.2s;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2501;
}

.search-close-btn:hover {
  color: var(--gold);
}

@media (max-width: 768px) {
  .search-bar-container {
    padding: 0 16px;
  }

  .search-input {
    padding: 14px 16px;
    font-size: 15px;
  }

  .search-btn {
    padding: 14px 24px;
    font-size: 12px;
  }

  .search-close-btn {
    top: 20px;
    right: 20px;
    font-size: 28px;
  }
}

/* ===== LOGIN MODAL ===== */
.login-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease;
}

.login-modal.active {
  opacity: 1;
  pointer-events: all;
}

.login-modal-content {
  background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
  border: 1px solid rgba(201, 168, 76, 0.3);
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.7), inset 0 1px 1px rgba(201, 168, 76, 0.1);
  animation: slideIn 0.18s ease-out;
  position: relative;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.login-modal-title {
  font-family: 'Cinzel', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 28px;
  text-align: center;
  letter-spacing: 0.05em;
}

.login-form-group {
  margin-bottom: 20px;
}

.login-form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray-light);
  margin-bottom: 8px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.login-form-group input {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(201, 168, 76, 0.2);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--white);
  font-size: 14px;
  font-family: 'Raleway', sans-serif;
  transition: all 0.2s;
}

.login-form-group input:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(201, 168, 76, 0.05);
  box-shadow: 0 0 8px rgba(201,168,76,0.08);
}

.login-form-group input::placeholder {
  color: rgba(255, 255, 255, 0.4);
}

.login-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--gold) 0%, #b8951f 100%);
  color: var(--black);
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 10px;
  text-transform: uppercase;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(201,168,76,0.25);
}

.login-btn:active {
  transform: translateY(0);
}

.login-error {
  background: rgba(229, 9, 20, 0.15);
  border: 1px solid rgba(229, 9, 20, 0.5);
  color: #ff6b6b;
  padding: 12px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 20px;
  text-align: center;
  display: none;
  animation: shake 0.3s;
}

.login-error.show {
  display: block;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.login-footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: var(--gray);
}

.login-footer a {
  color: var(--gold);
  text-decoration: none;
  cursor: pointer;
  transition: color 0.2s;
}

.login-footer a:hover {
  color: var(--gold-light);
}

.close-modal {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  color: var(--gray-light);
  cursor: pointer;
  font-size: 24px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}

.close-modal:hover {
  color: var(--gold);
}

/* ===== MOBILE NAV ===== */
@media (max-width: 768px) {
  .nav-links { display: none; }
  .logo { margin-right: 0; }
}

/* ===== SUPPORT MODAL ===== */
.support-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(6px);
